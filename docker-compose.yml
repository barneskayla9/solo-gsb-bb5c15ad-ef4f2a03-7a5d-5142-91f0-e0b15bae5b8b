services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: power-load-rehearsal:latest
    container_name: power-load-rehearsal
    ports:
      # 宿主机端口:容器端口；如本机 8080 被占用，改左边即可，例如 "18080:8080"
      - "${APP_PORT:-8080}:8080"
    environment:
      # SQLite 数据库文件位置（容器内路径）；首次启动自动建表并写入演示数据
      SQLITE_PATH: /app/data/app.db
      PORT: "8080"
      HOST: 0.0.0.0
    volumes:
      - power-sqlite-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 4s
      retries: 5
      start_period: 20s

volumes:
  power-sqlite-data:
